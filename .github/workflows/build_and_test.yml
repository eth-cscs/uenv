name: Build and test

defaults:
  run:
    shell: bash -l {0}

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        buildtype: [debug, release]
        sanitizer: [none, address, leak, undefined, thread]
        fuse: [true, false]
        exclude:
          # False positive warnings in release builds: https://godbolt.org/z/vT3nqGxzW
          - buildtype: release
            sanitizer: address
    runs-on: ubuntu-24.04
    container:
        image: ubuntu:noble
        options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Update apt repositories for ccache
        run: apt update
      - name: Install dependencies
        run: apt-get install --no-install-recommends --yes util-linux libmount-dev libslurm-dev
      #  run: sudo apt-get install util-linux libmount-dev slurm-wlm libslurm-dev slurmd slurmctld slurm-client
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-linux-${{ matrix.buildtype }}-${{ matrix.sanitizer }}
      - name: Install compiler and build tools
        run: |
            apt install --no-install-recommends --yes \
               g++-12 \
               ninja-build \
               libsquashfuse-dev \
               libfuse3-dev \
               wget \
               ca-certificates \
               python3 \
               pkg-config \
               sqlite3 \
               git \
               squashfs-tools \
               curl \
               ninja-build \
               locales \
               xxd \
               jq \
               make \
               perl \
               sudo

            locale-gen en_US.UTF-8
            update-locale LANG=en_US.UTF-8
      - name: install meson
        run: |
          wget https://github.com/mesonbuild/meson/releases/download/1.11.1/meson-1.11.1.tar.gz && \
          tar -xzf meson-1.11.1.tar.gz && \
          mv meson-1.11.1 meson && \
          mv meson/meson.py meson/meson && \
          chmod 755 meson/meson
      - name: Configure
        run: |
            CC="ccache gcc-12" CXX="ccache g++-12" ./meson/meson setup \
              --buildtype ${{ matrix.buildtype }} \
              -Db_sanitize=${{ matrix.sanitizer }} \
              -Dtests=enabled \
              -Dfuse=${{ matrix.fuse }} \
              -Dsquashfs_mount=true \
              --warnlevel 3 \
              --werror \
              build .
      - name: Build
        run: ./meson/meson compile -Cbuild
      - name: verify the binary has no unexpected runtime dependencies
        # uenv ships as a static binary: everything except the C/C++ runtime is
        # linked in, so that the same binary runs on any Alps vCluster. Nothing
        # checked this before, which made it a property of the build host
        # rather than of the source tree - see the "Subproject options and
        # stale build directories" section of CLAUDE.md.
        #
        # sanitizer builds legitimately pull in libasan/liblsan/libubsan/
        # libtsan, so the invariant is only asserted for the plain builds.
        if: matrix.sanitizer == 'none'
        run: |
          set -euo pipefail
          ldd build/uenv
          needed=$(LC_ALL=C readelf -d build/uenv \
                   | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' \
                   | grep -v '^ld-linux' | LC_ALL=C sort | tr '\n' ' ')
          expected='libc.so.6 libgcc_s.so.1 libm.so.6 libstdc++.so.6 '
          if [ "$needed" != "$expected" ]; then
            echo "::error::uenv runtime dependencies changed" >&2
            echo "  expected: $expected" >&2
            echo "  actual:   $needed" >&2
            exit 1
          fi
      - name: verify the linked OpenSSL version
        # OpenSSL is statically linked, so a distro update can never patch it:
        # the version here is the version users run until uenv is rebuilt.
        # Pinning it in CI forces a bump to be deliberate, and catches a wrap
        # that silently resolved to something else.
        # Update together with subprojects/openssl.wrap.
        run: |
          set -euo pipefail
          strings build/uenv | grep -E '^OpenSSL 3\.5\.7 ' \
            || { echo "::error::uenv is not linked against OpenSSL 3.5.7" >&2; exit 1; }
      - name: Stage
        run: sudo ./meson/meson install -Cbuild --destdir=$PWD/staging --no-rebuild --skip-subprojects
      - name: create mount points for tests
        run: sudo mkdir /user-tools /user-environment
      - name: verify zot is available for registry tests
        # the zot binary is fetched at build time by test/integration/install-zot,
        # which tolerates a failed download so local/offline builds still work (the
        # registry suite then self-skips). in CI we require it, so live OCI
        # round-trip coverage cannot silently vanish on a download hiccup.
        run: |
          test -x build/test/zot || {
            echo "::error::zot binary missing (build/test/zot) - registry tests would silently skip" >&2
            exit 1
          }
      - name: create unprivileged user for running tests
        # the --privileged flag caused the docker container to use root as default,
        # manually create an unprivileged user
        run: |
          useradd --create-home --shell /bin/bash citest
          chown -R citest:citest "$PWD/build"
          chown citest:citest /user-tools /user-environment
      - name: diagnose unprivileged userns/uid_map
        # temporary: investigating an EPERM on write(/proc/self/uid_map)
        # inside rootless::unshare_mount_map_root() that only appears on the
        # actual GitHub-hosted runner (a local `docker run --privileged
        # ubuntu:noble` + citest reproduction of the same unshare/prctl/write
        # sequence succeeds, so something about this environment specifically
        # is different). Remove once root-caused.
        run: |
          echo "== id citest =="
          id citest
          echo "== capabilities (as citest) =="
          sudo -u citest cat /proc/self/status | grep -E '^Cap(Inh|Prm|Eff|Bnd|Amb):'
          echo "== relevant sysctls =="
          for f in /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
                   /proc/sys/kernel/unprivileged_userns_clone \
                   /proc/sys/user/max_user_namespaces; do
            echo "$f: $(cat "$f" 2>/dev/null || echo n/a)"
          done
          echo "== /proc mount options =="
          mount | grep ' on /proc '
          echo "== initial /proc/self/uid_map (as citest, before unshare) =="
          sudo -u citest cat /proc/self/uid_map
          echo "== probe: unshare + prctl(DUMPABLE) + write uid_map, as citest =="
          printf '%s\n' \
            '#define _GNU_SOURCE' \
            '#include <sched.h>' \
            '#include <sys/prctl.h>' \
            '#include <stdio.h>' \
            '#include <errno.h>' \
            '#include <string.h>' \
            '#include <unistd.h>' \
            '#include <fcntl.h>' \
            'int main(void) {' \
            '    int uid = getuid();' \
            '    if (unshare(CLONE_NEWUSER | CLONE_NEWNS) != 0) { printf("unshare failed: %s\n", strerror(errno)); return 1; }' \
            '    printf("unshare ok\n");' \
            '    if (prctl(PR_SET_DUMPABLE, 1) != 0) { printf("prctl DUMPABLE failed: %s\n", strerror(errno)); return 1; }' \
            '    printf("prctl DUMPABLE ok\n");' \
            '    char buf[256]; snprintf(buf, sizeof(buf), "0 %d 1", uid);' \
            '    int fd = open("/proc/self/uid_map", O_WRONLY);' \
            '    if (fd < 0) { printf("open uid_map failed: %s\n", strerror(errno)); return 1; }' \
            '    ssize_t n = write(fd, buf, strlen(buf));' \
            '    if (n < 0) { printf("write uid_map \"%s\" failed: %s\n", buf, strerror(errno)); return 1; }' \
            '    printf("write uid_map ok\n");' \
            '    return 0;' \
            '}' \
            > /tmp/uidmap_probe.c
          gcc-12 -o /tmp/uidmap_probe /tmp/uidmap_probe.c
          chmod 755 /tmp/uidmap_probe
          sudo -u citest /tmp/uidmap_probe || true
      - name: unit tests
        run: sudo -u citest ./meson/meson test -Cbuild --verbose unit
      - name: cli integration tests
        run: |
          sudo -u citest env UENV_BATS_SKIP_START=on STAGING_PATH=$PWD/staging/usr/local ./meson/meson test -Cbuild --verbose cli
      - name: registry integration tests
        run: |
          sudo -u citest env UENV_BATS_SKIP_START=on STAGING_PATH=$PWD/staging/usr/local ./meson/meson test -Cbuild --verbose registry
      - name: squashfs-mount integration tests
        run: |
          sudo -u citest env UENV_BATS_SKIP_START=on STAGING_PATH=$PWD/staging/usr/local ./meson/meson test -Cbuild --verbose squashfs-mount
