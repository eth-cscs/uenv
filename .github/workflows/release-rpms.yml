name: Release RPMs

on:
  push:
    tags:
      - 'v*'

jobs:
  # Read packaging/slurm-versions and expose as a JSON array for the build matrix.
  config:
    runs-on: ubuntu-latest
    outputs:
      slurm-versions: ${{ steps.slurm.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
      - id: slurm
        run: |
          versions=$(grep -v '^#' packaging/slurm-versions | grep -v '^$' | jq -R . | jq -sc .)
          echo "versions=$versions" >> $GITHUB_OUTPUT

  build-rpms:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        os: ['15.5', '15.6']
        slurm: ${{ fromJSON(needs.config.outputs.slurm-versions) }}
        arch:
          - runner: ubuntu-24.04
            label: x86_64
          - runner: ubuntu-24.04-arm
            label: aarch64
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull build container
        run: docker pull ghcr.io/${{ github.repository_owner }}/uenv-build-sles${{ matrix.os }}:${{ matrix.arch.label }}

      - name: Build RPM
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/packaging:/work" \
            -v "${{ github.workspace }}:/source:ro" \
            -w /work \
            ghcr.io/${{ github.repository_owner }}/uenv-build-sles${{ matrix.os }}:${{ matrix.arch.label }} \
            ./suse-build.sh \
              --slurm-version=${{ matrix.slurm }} \
              --ref=HEAD \
              --os=${{ matrix.os }}

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-sles${{ matrix.os }}-${{ matrix.slurm }}-${{ matrix.arch.label }}
          path: packaging/artifacts/**/*.rpm
          if-no-files-found: error

  release:
    needs: build-rpms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          merge-multiple: true
          path: rpms/

      - name: List RPMs
        run: find rpms/ -name '*.rpm' | sort

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: rpms/**/*.rpm
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
